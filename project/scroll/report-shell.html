<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>玄與九爺｜你嘅命書</title>
<link rel="stylesheet" href="/report.css">
<script defer src="/report.js"></script>
</head>
<body>
<main class="letter">
  <header><p class="brand">玄與九爺 · 九巷茶室</p><h1 id="report-title">你嘅命書</h1><p id="report-plan" hidden></p></header>
  <section id="report-state" aria-live="polite"><h2 id="report-stage">九巷茶室・稍坐一陣</h2><p id="report-status">九爺斟多半杯茶，等一等，睇緊命書準備好未。</p><button type="button" id="report-retry" hidden>重新檢查一次</button></section>
  <p id="report-ready" hidden>完整四章已準備好，可以隨時再讀，或者自己留一份。</p>
  <article id="report-content" aria-labelledby="report-title" hidden></article>
  <div id="report-controls"><button type="button" id="report-print" hidden>列印或存成 PDF</button><a href="/">返茶室門口</a></div>
  <p id="report-privacy" hidden>呢條連結可以直接重開命書。請自己收好，唔好轉發。</p>
  <footer id="report-note" hidden>玄與九爺｜九巷茶室・只作傳統文化與自我反思參考，唔代替醫療、法律或投資建議。</footer>
</main>
</body>
</html>
